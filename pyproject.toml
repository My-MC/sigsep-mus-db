[project]
name = "musdb"
dynamic = ["version"]
description = "Python parser for the SIGSEP MUSDB18 dataset"
urls = {Repository = "https://github.com/sigsep/sigsep-mus-db"}
authors = [
    {name = "Fabian-Robert", email = "mail@faroit.com"},
    {name = "Stoeter" }
]
license = "MIT"
readme = {file = "README.md", content-type = "text/markdown"}
dependencies = [
    "numpy>=1.7,<3.0",
    "stempeg>=0.2.4",
    "pyaml",
    "tqdm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
scripts = {musdbconvert = "musdb.tools:musdb_convert"}
requires-python = ">=3.8"

[dependency-groups]
dev = ["check-manifest"]
tests = ["pytest"]
docs = ["sphinx", "sphinx_rtd_theme", "recommonmark"]

[tool.uv.sources]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "musdb/__init__.py"

[tool.pytest.ini_options]
norecursedirs = ".env\\* .cache .git examples docs"
addopts = "--doctest-modules"
